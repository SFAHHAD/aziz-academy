  <!-- SERVICE WORKER KILLSWITCH
       A previous build registered a Flutter service worker that aggressively
       cached main.dart.js. Once cached, the browser served the old bundle
       even after fresh deploys. This block runs synchronously at page load
       and unregisters every SW + clears every Cache Storage entry before
       flutter_bootstrap.js gets a chance to re-register one. Combined with
       --pwa-strategy=none in the build command, this fully disables SW
       caching going forward. Remove only after confirming users no longer
       have stale workers in the wild (~30 days post-deploy is safe). -->
  <script>
    (function () {
      try {
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function (regs) {
            for (var i = 0; i < regs.length; i++) regs[i].unregister();
          });
        }
        if ('caches' in window) {
          caches.keys().then(function (keys) {
            for (var i = 0; i < keys.length; i++) caches.delete(keys[i]);
          });
        }
      } catch (e) { /* best-effort */ }
    })();
  </script>

  <style>
    html, body { margin: 0; padding: 0; background: #0F2445; }

      border-radius: 50%;

    @keyframes aziz-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) {

    }
    /* Boot-timeout fallback. Hidden by default; revealed only when the
       first-frame hasn't fired within ~30s, so users on a flaky network
       or stuck behind a corrupted main.dart.js have a way out instead of
       staring at the spinner forever. */
    #aziz-splash-timeout { display: none; max-width: 320px; padding: 0 16px; }
    #aziz-splash.timeout .aziz-spinner { display: none; }
    #aziz-splash.timeout #aziz-splash-timeout { display: block; }
    #aziz-splash-timeout p { font-size: 13px; opacity: .85; margin: 12px 0; }
    #aziz-splash-timeout button {

      border: none; border-radius: 999px;
      font-weight: 800; font-size: 14px;
      cursor: pointer;
      font-family: inherit;
    }
  </style>

  <script>
    // Boot-timeout fallback: if Flutter's first frame hasn't fired within
    // 30s, swap the spinner for a bilingual "loading is taking longer
    // than usual" message with a Reload button. Otherwise a corrupted
    // main.dart.js or a network failure leaves users spinning forever.
    // 30s is generous: even slow 3G usually finishes in 15-25s; this
    // avoids false timeouts on legitimately-slow connections.
    var azizSplashTimeout = setTimeout(function () {
      var s = document.getElementById('aziz-splash');
      if (s && !s.classList.contains('fade')) {
        s.classList.add('timeout');
        if (window.console && console.warn) {
          console.warn('Flutter first-frame did not fire within 30s.');
        }
      }
    }, 30000);

    window.addEventListener('flutter-first-frame', function () {
      clearTimeout(azizSplashTimeout);
      var s = document.getElementById('aziz-splash');
      if (!s) return;
      s.classList.add('fade');
      setTimeout(function () { s.remove(); }, 600);
    });
  </script>
