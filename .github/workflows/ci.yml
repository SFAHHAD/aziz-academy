name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate-content:
    name: Validate quiz JSON packs + launch-readiness audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Quiz pack schema + ID uniqueness
        run: python scripts/validate_quiz_packs.py
      - name: Font coverage (every JSON char in bundled cmap)
        run: python scripts/audit_font_coverage.py
      - name: Sitemap routes match router
        run: python scripts/audit_sitemap_routes.py
      - name: Version constants match pubspec.yaml
        run: python scripts/audit_version_consistency.py

  flutter:
    name: Flutter analyze + test + build web
    runs-on: ubuntu-latest
    needs: validate-content
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release
