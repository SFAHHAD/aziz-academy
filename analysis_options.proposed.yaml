# Proposed stricter analysis_options.yaml for Aziz Academy.
#
# DO NOT swap this in wholesale. Adding all of these at once will produce
# hundreds of errors. The intended workflow (AUDIT_PLAN.md §3.4) is:
#
#   1. Pick ONE lint or analyzer option below.
#   2. Move it into the live `analysis_options.yaml`.
#   3. Run `flutter analyze --fatal-infos --fatal-warnings`.
#   4. Fix or ignore-with-justification every new finding.
#   5. Commit.  Repeat.
#
# Order suggested below mirrors typical pain-vs-payoff for a Flutter app of
# this size. Cheap wins are at the top.

include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    # MEDIUM PAYOFF, MEDIUM COST — start once formatting lints are clean.
    # Forces explicit casts; catches a lot of "dynamic crept in here" bugs.
    # strict-casts: true

    # MEDIUM PAYOFF, MEDIUM COST — turn on after strict-casts.
    # strict-inference: true

    # HIGH PAYOFF if you have Map/List used without a generic; pure win after
    # the other two are clean.
    # strict-raw-types: true

  errors:
    todo: ignore                          # do not fail CI on TODO comments
    # invalid_annotation_target: ignore   # uncomment if you start using Freezed / json_serializable

  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/l10n/app_localizations*.dart"   # generated by flutter gen-l10n
    - "build/**"
    - ".dart_tool/**"

linter:
  rules:
    # ---------- CHEAP STYLE WINS (start here) ----------
    prefer_single_quotes: true
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_declarations: true
    prefer_const_literals_to_create_immutables: true
    prefer_final_locals: true
    use_super_parameters: true
    sort_pub_dependencies: true
    always_use_package_imports: true       # forbids `import '../../core/...'`

    # ---------- CORRECTNESS WINS (apply after style is clean) ----------
    avoid_dynamic_calls: true              # catches Object?.foo at compile time
    avoid_returning_null_for_future: true  # null Future is almost always a bug
    avoid_slow_async_io: true              # flags `File.exists` etc.
    avoid_unused_constructor_parameters: true
    cancel_subscriptions: true             # forgetting to cancel = memory leak
    close_sinks: true                      # same for StreamController
    unawaited_futures: true                # forgotten await = silent failure

    # ---------- OPTIONAL / TASTE ----------
    # require_trailing_commas: true        # auto-formatter friendly but noisy on rollout
    # public_member_api_docs: true         # add only if you intend to publish packages
